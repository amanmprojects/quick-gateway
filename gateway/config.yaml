# quick-gateway — LiteLLM configuration
#
# Routes every OpenCode Zen chat-completions-class model so that BOTH
# OpenAI-Responses clients (codex CLI) and Anthropic-Messages clients
# (Claude Code) can reach them through one local endpoint.
#
# `model: openai/<name>` points at the OpenAI-compatible upstream;
# `use_chat_completions_api: true` makes LiteLLM bridge codex's
# /v1/responses requests onto that chat API. The upstream key comes from
# the environment (gateway.env). No master_key: loopback-only by design.

# Shared upstream defaults — DRY anchor. Each model merges this and only
# overrides its `model:` value. Keeps api_base/api_key in one place.
x-zen-defaults: &zen_defaults
  api_base: https://opencode.ai/zen/go/v1
  api_key: os.environ/OPENCODE_API_KEY
  use_chat_completions_api: true

model_list:
  - model_name: ox-alpha-free
    litellm_params:
      <<: *zen_defaults
      model: openai/ox-alpha-free

  - model_name: glm-5
    litellm_params:
      <<: *zen_defaults
      model: openai/glm-5

  - model_name: glm-5.1
    litellm_params:
      <<: *zen_defaults
      model: openai/glm-5.1

  - model_name: glm-5.2
    litellm_params:
      <<: *zen_defaults
      model: openai/glm-5.2

  - model_name: glm-5.3
    litellm_params:
      <<: *zen_defaults
      model: openai/glm-5.3

  - model_name: kimi-k3
    litellm_params:
      <<: *zen_defaults
      model: openai/kimi-k3

  - model_name: kimi-k2.7-code
    litellm_params:
      <<: *zen_defaults
      model: openai/kimi-k2.7-code

  - model_name: kimi-k2.6
    litellm_params:
      <<: *zen_defaults
      model: openai/kimi-k2.6

  - model_name: kimi-k2.5
    litellm_params:
      <<: *zen_defaults
      model: openai/kimi-k2.5

  - model_name: deepseek-v4-pro
    litellm_params:
      <<: *zen_defaults
      model: openai/deepseek-v4-pro

  - model_name: deepseek-v4-flash
    litellm_params:
      <<: *zen_defaults
      model: openai/deepseek-v4-flash

  - model_name: deepseek-v4-flash-vision-exp
    litellm_params:
      <<: *zen_defaults
      model: openai/deepseek-v4-flash-vision-exp

  - model_name: mimo-v2-pro
    litellm_params:
      <<: *zen_defaults
      model: openai/mimo-v2-pro

  - model_name: mimo-v2-omni
    litellm_params:
      <<: *zen_defaults
      model: openai/mimo-v2-omni

  - model_name: mimo-v2.5-pro
    litellm_params:
      <<: *zen_defaults
      model: openai/mimo-v2.5-pro

  - model_name: mimo-v2.5
    litellm_params:
      <<: *zen_defaults
      model: openai/mimo-v2.5

  - model_name: hy3
    litellm_params:
      <<: *zen_defaults
      model: openai/hy3

  - model_name: hy3-preview
    litellm_params:
      <<: *zen_defaults
      model: openai/hy3-preview

litellm_settings:
  # silently drop client params a chat-completions backend cannot express
  drop_params: true
  # upstream resilience
  request_timeout: 60
  num_retries: 2
  # /v1/messages: litellm 1.97 routes openai/* models through its Responses
  # API adapter first (Anthropic -> Responses -> chat completions); that double
  # hop returns empty content once tools/system are present. Route straight to
  # chat completions instead.
  use_chat_completions_url_for_anthropic_messages: true
