# Claude Code profile for quick-gateway, using claude-profile-manager (cpm)
# https://github.com/JakubKontra/claude-profile-manager
#
# One-time, on the machine running Claude Code:
#   1. keep a tunnel to the VM alive:  ssh -N -L 4000:127.0.0.1:4000 <vm-host>
#   2. merge this snippet into ~/.claude-profiles/config.toml
#   3. launch with:  claude-zen
#
# Not using cpm? Point any Claude Code session at the gateway instead via
# project .claude/settings.json:
#   { "env": { "ANTHROPIC_BASE_URL": "http://127.0.0.1:4000",
#              "ANTHROPIC_AUTH_TOKEN": "quick-gateway-local" } }

[profiles.zen]
description = "OpenCode Zen models via quick-gateway SSH tunnel"
model = "ox-alpha-free"

[profiles.zen.env]
ANTHROPIC_BASE_URL = "http://127.0.0.1:4000"
# dummy on purpose: the gateway is auth-free on loopback/tunnel by design.
ANTHROPIC_AUTH_TOKEN = "quick-gateway-local"
# If Claude Code complains about missing credentials, additionally set:
# ANTHROPIC_API_KEY = " "
